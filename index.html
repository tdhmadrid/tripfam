<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Viaje Alpes en familia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: guía de ruta vertical — cuentas editables arriba, luego cada parada como un tramo de carretera con su señal amarilla de distancia */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#16232E; --muted:#5A6B78; --line:#D6DEE4;
  --glacier:#1F5E86; --glacier-soft:#E3EEF5;
  --sign:#F2C200; --sign-ink:#1A1A1A;
  --pos:#1E7A4B; --pos-soft:#E1F2E8; --neg:#B23A2E; --neg-soft:#F7E3E0;
  --display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171E; --surface:#16212A; --ink:#E6EDF2; --muted:#93A4B1; --line:#2A3A46;
  --glacier:#7DB8DF; --glacier-soft:#1B2F3D; --sign:#F2C200; --sign-ink:#1A1A1A;
  --pos:#5CC48D; --pos-soft:#173328; --neg:#F08A7E; --neg-soft:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171E; --surface:#16212A; --ink:#E6EDF2; --muted:#93A4B1; --line:#2A3A46;
  --glacier:#7DB8DF; --glacier-soft:#1B2F3D; --sign:#F2C200; --sign-ink:#1A1A1A;
  --pos:#5CC48D; --pos-soft:#173328; --neg:#F08A7E; --neg-soft:#3A1E1B; color-scheme:dark}

*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(30px,6vw,46px);font-weight:800;font-stretch:88%;letter-spacing:-.01em}
h2{font-size:24px;font-weight:750;font-stretch:92%}
h3{font-size:19px;font-weight:700}
p{margin:0}
a{color:var(--glacier)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--glacier);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
section{display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px}

header{display:flex;flex-direction:column;gap:12px}
.route{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-family:var(--display);font-weight:600;font-stretch:95%;font-size:15px}
.route .arr{color:var(--muted)}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.chip b{font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.summary div{display:flex;flex-direction:column;gap:2px;min-width:0}
.summary .big{font-family:var(--display);font-size:26px;font-weight:750;font-stretch:90%}
.summary .alt{font-size:13px;color:var(--muted)}

/* controles */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--glacier);color:var(--surface)}
.rate{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap}
input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input:hover,select:hover{border-color:var(--muted)}
input:disabled,select:disabled{background:transparent;border-color:transparent;color:var(--ink);opacity:1}
.rate input{width:90px;text-align:right}
.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--glacier);color:var(--glacier)}
.btn.primary{background:var(--glacier);border-color:var(--glacier);color:var(--surface)}
.btn.primary:hover{color:var(--surface);filter:brightness(1.1)}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);border-color:var(--neg);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:16px;line-height:1}
.icon-btn:hover{color:var(--neg);background:var(--neg-soft)}
.icon-btn.armed{color:var(--surface);background:var(--neg);font-size:12px;font-weight:600}
.icon-btn:disabled{opacity:.3;cursor:not-allowed;background:transparent;color:var(--muted)}

.people{display:flex;flex-direction:column}
.person{display:grid;grid-template-columns:minmax(120px,190px) 1fr auto;align-items:center;gap:8px 14px;padding:8px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person input.pname{font-weight:600;width:100%}
.cover{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13.5px;min-width:0}
.cover .lbl{color:var(--muted)}
.cover label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.cover input{accent-color:var(--glacier)}
.dep-tag{font-size:12px;font-weight:600;background:var(--sign);color:var(--sign-ink);border-radius:4px;padding:1px 6px}
.bal.dep .val{color:var(--muted);font-weight:500;font-size:12.5px}
@media (max-width:640px){.person{grid-template-columns:1fr auto}.cover{grid-column:1/-1;grid-row:2}}

.tablebox{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding-block:8px}
td.r,th.r{text-align:right;white-space:nowrap}
.exp-table{min-width:880px}
.exp-table tr.pending td{background:color-mix(in srgb,var(--sign) 14%,transparent)}
.exp-table tr.pending select.status-sel{border-color:var(--sign);font-weight:600}
.pend-note{font-size:13.5px;border-left:3px solid var(--sign);padding-left:12px}
.pend-note:empty{display:none}
.chat-log{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:2px}
.msg{max-width:85%;font-size:14px;padding:9px 12px;border-radius:12px;line-height:1.45;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--glacier);color:var(--surface);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.msg.err{background:var(--neg-soft)}
.proposal{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.prop{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.prop .what{font-size:13.5px}
.prop .what b{font-weight:600}
.prop .done{font-size:12.5px;font-weight:600;color:var(--pos)}
.prop-actions{display:flex;gap:6px}
.chat-form{display:flex;gap:8px}
.chat-form input{flex:1;padding:9px 10px}
.road{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--bg);border-radius:10px;padding:10px 12px}
.road .lbl{font-size:13px;font-weight:600}
.road-btns{display:flex;flex-wrap:wrap;gap:6px}
.exp-table tr.group td{background:transparent;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding-top:16px}
.exp-table tr.group td span{float:right;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink)}
.note:empty{display:none}
.paid.later{background:color-mix(in srgb,var(--sign) 30%,transparent);color:var(--ink)}
.exp-table input.concept{width:100%}
.exp-table input.dates{width:100%}
.exp-table input.amount{width:96px;text-align:right}
.exp-table select{width:100%}
.exp-table .conv{font-size:12.5px;color:var(--muted)}
tfoot td{font-weight:600;border-bottom:none;padding-top:10px}

.status{font-size:13.5px;border-radius:8px;padding:10px 12px;background:var(--glacier-soft)}
.status.err{background:var(--neg-soft)}

.balances{display:flex;flex-direction:column;gap:10px}
.bal{display:grid;grid-template-columns:120px 1fr 1fr 120px;align-items:center;gap:8px;font-size:14px}
.bal .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bal .neg-side{display:flex;justify-content:flex-end}
.bar{height:14px;border-radius:3px}
.bar.neg{background:var(--neg)}
.bar.pos{background:var(--pos)}
.bal .axis{border-left:1px solid var(--line);height:22px;display:flex;align-items:center}
.bal .val{text-align:right;font-weight:600}
.val.pos{color:var(--pos)} .val.neg{color:var(--neg)}

.transfers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tr{border-radius:10px;padding:12px 14px;background:var(--glacier-soft);display:flex;justify-content:space-between;align-items:center;gap:12px}
.tr .who{font-size:14px}
.tr .amt{font-family:var(--display);font-weight:750;font-size:20px;white-space:nowrap;text-align:right}
.tr .amt small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--sign);padding-left:12px}

.stops{display:flex;flex-direction:column}
.leg{display:flex;align-items:center;gap:12px;padding:10px 0 10px 18px;border-left:3px dashed var(--line);margin-left:14px;flex-wrap:wrap}
.sign{background:var(--sign);color:var(--sign-ink);font-family:var(--display);font-weight:700;font-stretch:85%;font-size:13px;padding:3px 10px;border-radius:3px;white-space:nowrap}
.leg .lbl{font-size:13px;color:var(--muted)}
.stop{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.stop-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.dates-lbl{font-family:var(--display);font-weight:600;font-stretch:92%;color:var(--glacier);font-size:15px}
.hotel{display:grid;grid-template-columns:1fr auto;gap:10px 16px;background:var(--bg);border-radius:10px;padding:14px}
.hotel .hn{font-weight:600}
.addr{font-size:14px;user-select:all}
.hotel .facts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.paid{font-size:12.5px;font-weight:600;background:var(--glacier-soft);color:var(--glacier);border-radius:6px;padding:2px 8px}
.paid:empty{display:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:start;justify-content:flex-end}
.todo{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px}
.todo li{font-size:14px;padding-left:14px;position:relative}
.todo li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--glacier)}
.todo b{font-weight:600}
.warn{font-size:13.5px;background:var(--neg-soft);color:var(--ink);border-radius:8px;padding:10px 12px}
.warn b{color:var(--neg)}
.daylist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.daylist div{display:grid;grid-template-columns:86px 1fr;gap:8px}
.daylist .d{font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;margin-bottom:-16px}
.tabs button{font:inherit;font-family:var(--display);font-weight:650;font-stretch:92%;font-size:16px;border:0;background:transparent;color:var(--muted);padding:12px 14px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sign)}
.tabs button:hover{color:var(--ink)}
.zone{border-top:1px solid var(--line);padding-top:12px}
.zone summary{cursor:pointer;font-weight:600;color:var(--glacier);font-size:14.5px;list-style:none;display:flex;align-items:center;gap:8px}
.zone summary::-webkit-details-marker{display:none}
.zone summary::before{content:"+";display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--glacier-soft);font-weight:700}
.zone[open] summary::before{content:"−"}
.zone-body{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px;margin-top:14px}
.zone-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.zone-col.full{grid-column:1/-1}
.zone h4{margin:0;font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.items li{display:flex;flex-direction:column;gap:2px;font-size:14px}
.items b{font-weight:600}
.items em{font-style:normal;font-size:12.5px;color:var(--muted)}
.items span{color:var(--ink)}
.items a{font-size:13px;align-self:flex-start}
.tips{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
@media (max-width:640px){.zone-body{grid-template-columns:1fr}.tabs button{font-size:15px;padding:10px 10px 8px}}
.zchat{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.zchat h4{margin:0;font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.zchat .chips{display:flex;flex-wrap:wrap;gap:6px}
.zchat .chips button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.zchat .chips button:hover{border-color:var(--glacier);color:var(--glacier)}
.zchat .chat-log{max-height:300px}
.zchat .chat-log:empty{display:none}
.msg.bot p{margin:0 0 6px}.msg.bot p:last-child{margin:0}
.live-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sign);border-radius:10px;padding:12px 14px}
.live-text{display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}
.live{background:var(--glacier-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.live:empty{display:none}
.live .lh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.live p{font-size:14px}
.live ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.live li a{font-size:12.5px;margin-left:4px}
.mkt{font-size:13px}
.mkt button{font:inherit;font-size:12.5px;border:0;background:none;color:var(--glacier);text-decoration:underline;cursor:pointer;padding:0}
.pdf-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.live-btns{display:flex;gap:8px;flex-wrap:wrap}
.wx-panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.wx-days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.wx-day{flex:0 0 112px;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--bg);border-top:4px solid var(--zc,var(--glacier))}
.wx-day .wd{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.wx-day .wz{font-size:11.5px;color:var(--muted)}
.wx-day svg{width:30px;height:30px}
.wx-day .wt{font-family:var(--display);font-weight:750;font-size:18px}
.wx-day .wt small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.wx-day .wdesc{font-size:12px;line-height:1.3}
.wx-day .wp{font-size:11.5px;color:var(--glacier);font-weight:600}
.stop .wx-row{display:flex;gap:8px;overflow-x:auto}
.stop .wx-row .wx-day{flex-basis:104px}
.wx-note{font-size:13px;color:var(--muted)}
footer{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

@media (max-width:640px){
  .summary{grid-template-columns:1fr 1fr}
  .summary div:last-child{grid-column:1/-1}
  .transfers,.todo{grid-template-columns:1fr}
  .hotel{grid-template-columns:1fr}
  .actions{justify-content:flex-start}
  .bal{grid-template-columns:84px 1fr 1fr 104px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.data-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gate{min-height:100vh;display:grid;place-items:center;padding-block:24px}
.gate-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gate-top{background:var(--glacier);color:#fff;padding:22px 22px 18px;display:flex;flex-direction:column;gap:6px;border-bottom:4px solid var(--sign)}
.gate-top .eyebrow{color:rgba(255,255,255,.8)}
.gate-top h1{font-size:30px;color:#fff}
.gate form{padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px}
.gate label.l{font-size:13px;font-weight:600}
.gate input[type=password]{font-size:22px;letter-spacing:.4em;text-align:center;padding:10px;width:100%}
.gate .remember{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.gate .btn{padding:10px;font-size:15px}
.gate-err{font-size:13.5px;color:var(--neg);min-height:1.2em}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-top"><span class="eyebrow">Visita de la familia · 25 nov – 2 dic 2026</span><h1>Viaje Alpes en familia</h1></div>
    <form id="gate-form" autocomplete="off">
      <label class="l" for="gate-pass">Contraseña</label>
      <input id="gate-pass" type="password" inputmode="numeric" autocomplete="current-password" required autofocus>
      <label class="remember"><input type="checkbox" id="gate-remember"> Recordar en este dispositivo</label>
      <button type="submit" class="btn primary" id="gate-btn">Entrar</button>
      <p class="gate-err" id="gate-err" role="alert"></p>
    </form>
  </div>
</div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  const KEY="viaje-alpes-acceso";
  const unb=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
  async function open(pass){
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb(ENC.salt),iterations:ENC.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb(ENC.iv)},key,unb(ENC.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  function start(p){
    document.getElementById("gate").remove();
    document.getElementById("app").outerHTML=p.html;
    const s=document.createElement("script");s.textContent=p.js;document.body.appendChild(s);
  }
  async function attempt(pass,remember,quiet){
    const btn=document.getElementById("gate-btn"),err=document.getElementById("gate-err");
    btn.disabled=true;btn.textContent="Abriendo…";err.textContent="";
    try{const p=await open(pass);
      try{if(remember)localStorage.setItem(KEY,pass);sessionStorage.setItem(KEY,pass)}catch(e){}
      start(p)}
    catch(e){try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY)}catch(_){}
      if(!quiet)err.textContent=window.crypto&&crypto.subtle?"Contraseña incorrecta.":"Este navegador no puede abrir la guía. Ábrela desde https en un navegador actualizado.";
      btn.disabled=false;btn.textContent="Entrar";document.getElementById("gate-pass").select()}
  }
  document.getElementById("gate-form").addEventListener("submit",ev=>{ev.preventDefault();
    attempt(document.getElementById("gate-pass").value.trim(),document.getElementById("gate-remember").checked,false)});
  let saved=null;try{saved=sessionStorage.getItem(KEY)||localStorage.getItem(KEY)}catch(e){}
  if(saved)attempt(saved,false,true);
})();
</script>
